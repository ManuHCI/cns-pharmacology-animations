<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABA ⇌ Glutamate Balance — CNS Excitation/Inhibition | MAMC Pharmacology</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #f4f6fa;
    color: #1a2332;
    padding: 6px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow: hidden;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px;
    border-bottom: 2px solid #c8133a;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; color: #0d2c4d; font-weight: 700; }
  header .subtitle { font-size: 11px; color: #4a5568; }

  /* State selector */
  .state-selector {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    flex-shrink: 0;
  }
  .state-btn {
    border: 2px solid transparent;
    background: white;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: inherit;
    box-shadow: 0 1px 4px rgba(13, 44, 77, 0.08);
    transition: all 0.15s;
    text-align: left;
  }
  .state-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(13, 44, 77, 0.15); }
  .state-btn .icon { font-size: 22px; flex-shrink: 0; }
  .state-btn .title { font-size: 13px; font-weight: 800; display: block; line-height: 1.1; }
  .state-btn .desc { font-size: 10px; color: #718096; display: block; margin-top: 2px; }
  .state-btn.depression.active { border-color: #553c9a; background: #faf5ff; }
  .state-btn.depression.active .title { color: #553c9a; }
  .state-btn.normal.active { border-color: #38a169; background: #f0fdf4; }
  .state-btn.normal.active .title { color: #22543d; }
  .state-btn.seizure.active { border-color: #c8133a; background: #fff5f5; }
  .state-btn.seizure.active .title { color: #c8133a; }

  /* Status banner */
  .status-banner {
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px; font-weight: 700;
    text-align: center; border: 2px solid;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .status-depression { background: #faf5ff; color: #322659; border-color: #553c9a; }
  .status-normal     { background: #f0fdf4; color: #22543d; border-color: #38a169; }
  .status-seizure    { background: #fff5f5; color: #742a2a; border-color: #c8133a; }

  /* Main grid */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }

  /* Animation panel */
  .animation-panel {
    background: white;
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-shadow: 0 1px 6px rgba(13, 44, 77, 0.06);
  }
  svg.scene {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: block;
  }

  /* Side panel */
  aside.info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }
  .info-card {
    background: white;
    border-radius: 8px;
    padding: 8px 12px;
    box-shadow: 0 1px 4px rgba(13, 44, 77, 0.06);
    border-left: 4px solid #0d2c4d;
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .info-card.clinical { border-left-color: #4299e1; }
  .info-card.causes { border-left-color: #d69e2e; }
  .info-card.treatment { border-left-color: #38a169; }
  .info-card h3 {
    font-size: 11px;
    color: #0d2c4d;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    flex-shrink: 0;
  }
  .info-card ul {
    list-style: none;
    overflow-y: auto;
    flex: 1;
  }
  .info-card li {
    padding: 3px 0 3px 14px;
    position: relative;
    font-size: 11.5px;
    line-height: 1.35;
    border-bottom: 1px dashed #e2e8f0;
  }
  .info-card li:last-child { border-bottom: none; }
  .info-card li::before {
    content: '▸';
    position: absolute; left: 2px;
    color: #4a5568; font-weight: 700;
  }
  .info-card.clinical li::before { color: #4299e1; }
  .info-card.causes li::before { color: #d69e2e; }
  .info-card.treatment li::before { color: #38a169; }
  .info-card li strong { color: #0d2c4d; }

  @media (max-width: 1000px) {
    .main-grid { grid-template-columns: 1fr; }
    body { overflow-y: auto; }
  }
</style>

      <!-- Section labels -->

      <!-- GABA presynaptic terminal -->

        <!-- vesicles -->

  <aside class="info">

</div>

<script>
// ============================================================
//  GABA / Glutamate balance — clinical states
// ============================================================
const STATES = {
  normal: {
    name: '⚖️ Normal balance — awake, alert, oriented',
    bannerClass: 'status-normal',
    eegColor: '#10b981',
    eegLabel: 'Normal α/β rhythm (8–30 Hz)',
    gabaReleaseRate: 0.20,    // probability per frame
    gluReleaseRate: 0.20,
    firingHz: 8,              // ~8 Hz baseline firing
    eegAmp: 12,
    eegFreq: 0.12,
    clinical: [
      '<strong>Awake</strong>, alert, oriented (GCS 15)',
      'Normal speech, coordination, cognition',
      'Normal respiration (~14/min) and BP',
      'Smooth movements, no involuntary activity',
      'EEG: normal alpha (8–13 Hz) at rest, beta (13–30 Hz) with attention'
    ],
    causes: [
      'Healthy physiological balance — equal inhibition &amp; excitation',
      '<strong>GABA</strong> is the chief inhibitory neurotransmitter',
      '<strong>Glutamate</strong> is the chief excitatory neurotransmitter',
      'Glycine also contributes to inhibition (mainly spinal/brainstem)',
      'About 40% of CNS synapses are GABAergic'
    ],
    treatment: [
      'No treatment indicated',
      'Maintain physiological homeostasis',
      'Avoid drugs that disrupt the balance unnecessarily',
      'Educate patients about substances that shift balance (alcohol, sedatives)'
    ]
  },
  depression: {
    name: '😴 CNS DEPRESSION — sedation / coma / respiratory depression',
    bannerClass: 'status-depression',
    eegColor: '#8b5cf6',
    eegLabel: 'Slow δ waves (0.5–4 Hz) — depressed activity',
    gabaReleaseRate: 0.60,
    gluReleaseRate: 0.05,
    firingHz: 0.8,
    eegAmp: 20,
    eegFreq: 0.025,
    clinical: [
      '<strong>Drowsy → sedated → stuporous → comatose</strong>',
      'GCS falls progressively (15 → 8 → 3)',
      '<strong>Respiratory depression</strong> (↓ rate &amp; depth) — main cause of death',
      'Hypotension, bradycardia',
      'Slurred speech, ataxia, nystagmus at lower doses',
      'Hypothermia, depressed reflexes',
      'EEG: slow delta waves, eventually burst-suppression'
    ],
    causes: [
      '<strong>Benzodiazepines</strong> (diazepam, lorazepam, midazolam) — ↑ Cl⁻ channel <em>frequency</em>',
      '<strong>Barbiturates</strong> (phenobarbital, thiopental) — ↑ Cl⁻ channel <em>duration</em>',
      '<strong>Z-drugs</strong> (zolpidem, zaleplon, zopiclone)',
      '<strong>Alcohol</strong> — facilitates GABA-A &amp; blocks NMDA',
      'General anaesthetics (propofol, etomidate, isoflurane)',
      'GABA-B agonist: baclofen (high dose)',
      'NMDA antagonists: ketamine, dextromethorphan',
      'Opioids — indirect (presynaptic ↓ glutamate release)'
    ],
    treatment: [
      '<strong>Airway, Breathing, Circulation</strong> first — intubate if GCS &lt; 8',
      '<strong>Flumazenil</strong> 0.2 mg IV — pure BZD antagonist <em>(avoid if BZD-dependent — precipitates seizures)</em>',
      '<strong>Naloxone</strong> if opioid co-ingestion suspected',
      'Activated charcoal if recent oral ingestion (&lt; 1 h)',
      'Forced alkaline diuresis for phenobarbital (urine pH &gt; 7.5)',
      'Haemodialysis for severe phenobarbital / alcohol',
      'No specific antidote for alcohol — supportive care'
    ]
  },
  seizure: {
    name: '⚡ SEIZURE / EPILEPSY — uncontrolled cortical hyperexcitation',
    bannerClass: 'status-seizure',
    eegColor: '#ef4444',
    eegLabel: 'Spike &amp; wave / polyspike — seizure activity',
    gabaReleaseRate: 0.03,
    gluReleaseRate: 0.75,
    firingHz: 35,
    eegAmp: 28,
    eegFreq: 0.18,
    clinical: [
      '<strong>Tonic-clonic, focal, absence, or myoclonic</strong> seizures',
      'Loss of consciousness in generalised seizures',
      'Postictal confusion, headache, drowsiness',
      '<strong>Status epilepticus</strong> if &gt;5 min — neurological emergency',
      'Risk of permanent neuronal injury (excitotoxicity)',
      'Tongue biting, incontinence, injury from fall',
      'EEG: interictal spikes, ictal rhythmic discharges'
    ],
    causes: [
      '<strong>GABA antagonists:</strong> bicuculline, picrotoxin, pentylenetetrazol (PTZ)',
      '<strong>Flumazenil</strong> in BZD-dependent patient',
      '<strong>Withdrawal:</strong> BZDs, barbiturates, alcohol (delirium tremens)',
      'High-dose β-lactams (penicillin, cefepime), imipenem',
      'Isoniazid (INH) — depletes pyridoxine → ↓ GABA synthesis',
      'Theophylline / aminophylline toxicity',
      'Local anaesthetic toxicity (lidocaine, bupivacaine)',
      'Tramadol, bupropion, TCAs at toxic doses',
      'Idiopathic epilepsy (genetic channelopathies)'
    ],
    treatment: [
      '<strong>1st line — IV Lorazepam 4 mg</strong> (or Diazepam 10 mg, Midazolam IM)',
      '<strong>2nd line — IV Phenytoin / Fosphenytoin</strong> 20 mg/kg loading',
      '<strong>3rd line — IV Phenobarbital</strong> 20 mg/kg loading',
      'Alternatives: Levetiracetam, Valproate IV',
      'Refractory: <strong>Propofol or Midazolam infusion</strong>, general anaesthesia',
      'For INH-induced seizures: <strong>Pyridoxine (vit B6)</strong> 1 g IV per gram of INH ingested',
      'Treat underlying cause: electrolytes, glucose, infection, alcohol withdrawal',
      'Chronic therapy with appropriate AEDs based on seizure type'
    ]
  }
};

let currentState = 'normal';
const scene = document.getElementById('scene');
const gabaParticlesEl = document.getElementById('gaba-particles');
const gluParticlesEl = document.getElementById('glu-particles');
const spikeTrainEl = document.getElementById('spike-train');
const drugIndicatorsEl = document.getElementById('drug-indicators');

// Particles arrays
let gabaParticles = [];
let gluParticles = [];

// Neuron firing model
let timeSinceLastSpike = 0;
const spikeTrail = [];  // recent spike times for visualization
const SPIKE_TRAIL_LEN = 30;

// EEG history
let eegHistory = [];
const EEG_LEN = 200;
let eegPhase = 0;

// Animation timing
let lastTimestamp = null;

// ============================================================
//  PARTICLE SYSTEM — GABA & glutamate release/diffusion
// ============================================================
function spawnGABA() {
  // Release from vesicles in GABA-pre, falling toward GABA-A receptor at y=178
  const xPositions = [100, 140, 180, 220, 260];
  const x = xPositions[Math.floor(Math.random() * xPositions.length)] + (Math.random() - 0.5) * 10;
  gabaParticles.push({
    x: x,
    y: 130 + Math.random() * 10,
    vy: 0.8 + Math.random() * 0.6,
    bound: false,
    boundTime: 0
  });
}
function spawnGlu() {
  const xPositions = [560, 600, 640, 680, 720];
  const x = xPositions[Math.floor(Math.random() * xPositions.length)] + (Math.random() - 0.5) * 10;
  gluParticles.push({
    x: x,
    y: 130 + Math.random() * 10,
    vy: 0.8 + Math.random() * 0.6,
    bound: false,
    boundTime: 0
  });
}

function updateParticles(dt) {
  // Spawn based on state
  const state = STATES[currentState];
  if (Math.random() < state.gabaReleaseRate) spawnGABA();
  if (Math.random() < state.gluReleaseRate) spawnGlu();

  gabaParticles.forEach(p => {
    if (!p.bound) {
      p.y += p.vy;
      if (p.y >= 178) { p.bound = true; p.y = 178; p.boundTime = 0; }
    } else {
      p.boundTime += dt;
    }
  });
  gluParticles.forEach(p => {
    if (!p.bound) {
      p.y += p.vy;
      if (p.y >= 178) { p.bound = true; p.y = 178; p.boundTime = 0; }
    } else {
      p.boundTime += dt;
    }
  });

  // Remove old bound particles
  gabaParticles = gabaParticles.filter(p => !p.bound || p.boundTime < 400);
  gluParticles = gluParticles.filter(p => !p.bound || p.boundTime < 400);

  // Cap particle counts
  if (gabaParticles.length > 40) gabaParticles = gabaParticles.slice(-40);
  if (gluParticles.length > 40) gluParticles = gluParticles.slice(-40);
}

function renderParticles() {
  let gabaHTML = '';
  gabaParticles.forEach(p => {
    const opacity = p.bound ? Math.max(0, 1 - p.boundTime/400) : 1;
    gabaHTML += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="#2563eb" stroke="#1e3a8a" stroke-width="1" opacity="${opacity.toFixed(2)}"/>`;
    gabaHTML += `<text x="${p.x.toFixed(1)}" y="${(p.y+3).toFixed(1)}" font-size="7" fill="white" text-anchor="middle" font-weight="800" opacity="${opacity.toFixed(2)}">G</text>`;
  });
  gabaParticlesEl.innerHTML = gabaHTML;

  let gluHTML = '';
  gluParticles.forEach(p => {
    const opacity = p.bound ? Math.max(0, 1 - p.boundTime/400) : 1;
    gluHTML += `<polygon points="${p.x},${p.y-5} ${p.x-5},${p.y+4} ${p.x+5},${p.y+4}" fill="#dc2626" stroke="#7f1d1d" stroke-width="1" opacity="${opacity.toFixed(2)}"/>`;
    gluHTML += `<text x="${p.x.toFixed(1)}" y="${(p.y+3).toFixed(1)}" font-size="7" fill="white" text-anchor="middle" font-weight="800" opacity="${opacity.toFixed(2)}">E</text>`;
  });
  gluParticlesEl.innerHTML = gluHTML;
}

// ============================================================
//  NEURON FIRING — spikes propagating along axon
// ============================================================
function updateFiring(dt) {
  const state = STATES[currentState];
  // Interval between spikes (ms)
  const meanInterval = 1000 / state.firingHz;

  timeSinceLastSpike += dt;
  // Stochastic firing — Poisson-like
  if (timeSinceLastSpike > meanInterval * 0.5) {
    const probability = (timeSinceLastSpike / meanInterval) * 0.05;
    if (Math.random() < probability) {
      // Fire a spike
      spikeTrail.push({ time: Date.now(), pos: 0 });
      timeSinceLastSpike = 0;
    }
  }

  // Move spikes down the axon
  spikeTrail.forEach(s => {
    s.pos += 0.06 * dt;
  });
  while (spikeTrail.length > 0 && spikeTrail[0].pos > 1) spikeTrail.shift();
  if (spikeTrail.length > SPIKE_TRAIL_LEN) spikeTrail.shift();
}

function renderFiring() {
  let html = '';
  // Soma "glow" intensity based on firing rate
  const state = STATES[currentState];
  const glow = Math.min(1, state.firingHz / 35);
  const glowColor = currentState === 'seizure' ? '#fee2e2' : (currentState === 'depression' ? '#e9d5ff' : '#dcfce7');
  html += `<ellipse cx="410" cy="310" rx="${80 + glow*8}" ry="${45 + glow*5}" fill="${glowColor}" opacity="${0.3 + glow*0.4}"/>`;

  // Spikes propagating along axon (y from 355 to 395, plus pre-axon onto soma area)
  spikeTrail.forEach(s => {
    const y = 350 + s.pos * 45;
    if (y > 350 && y < 400) {
      html += `<circle cx="410" cy="${y.toFixed(1)}" r="6" fill="#fbbf24" stroke="#92400e" stroke-width="1.5" opacity="0.9"/>`;
    }
  });

  // Firing rate indicator
  html += `<text x="510" y="375" font-size="11" fill="#0d2c4d" font-weight="700">Firing: ${state.firingHz} Hz</text>`;

  spikeTrainEl.innerHTML = html;
}

// ============================================================
//  EEG TRACE
// ============================================================
function generateEEGSample(state) {
  // Multi-frequency synthetic EEG
  eegPhase += state.eegFreq;
  let v;
  if (currentState === 'normal') {
    // Alpha+beta mix
    v = Math.sin(eegPhase) * 0.5 + Math.sin(eegPhase * 2.3) * 0.3 + Math.sin(eegPhase * 4.1) * 0.2;
  } else if (currentState === 'depression') {
    // Slow delta with low frequency content
    v = Math.sin(eegPhase) * 0.8 + Math.sin(eegPhase * 0.7) * 0.4;
  } else { // seizure
    // Spike-and-wave: rhythmic spikes
    const t = eegPhase;
    const slow = Math.sin(t) * 0.4;
    const spike = (Math.sin(t * 3) > 0.7) ? Math.sin(t * 30) * 0.6 : 0;
    v = slow + spike;
  }
  // Add small noise
  v += (Math.random() - 0.5) * 0.15;
  return v * state.eegAmp;
}

function updateEEG() {
  const state = STATES[currentState];
  eegHistory.push(generateEEGSample(state));
  if (eegHistory.length > EEG_LEN) eegHistory.shift();
}

function renderEEG() {
  const state = STATES[currentState];
  if (eegHistory.length < 2) return;
  // EEG box: x 20-800, y 410-488 (centered at y=449)
  const x0 = 20, x1 = 800, yCenter = 449;
  const dx = (x1 - x0) / (EEG_LEN - 1);
  let d = '';
  eegHistory.forEach((v, i) => {
    const x = x0 + i * dx;
    const y = yCenter - v;
    d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
  });
  const trace = document.getElementById('eeg-trace');
  trace.setAttribute('d', d);
  trace.setAttribute('stroke', state.eegColor);

  const lbl = document.getElementById('eeg-label');
  lbl.innerHTML = state.eegLabel;
  lbl.setAttribute('fill', state.eegColor);
}

// ============================================================
//  STATE CHANGE
// ============================================================
function setState(newState) {
  currentState = newState;
  const state = STATES[newState];

  // Update active button
  document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.state-btn[data-state="${newState}"]`).classList.add('active');

  // Update banner
  const banner = document.getElementById('statusBanner');
  banner.textContent = state.name;
  banner.className = 'status-banner ' + state.bannerClass;

  // Update info panels
  document.getElementById('clinicalList').innerHTML = state.clinical.map(c => `<li>${c}</li>`).join('');
  document.getElementById('causesList').innerHTML = state.causes.map(c => `<li>${c}</li>`).join('');
  document.getElementById('treatmentList').innerHTML = state.treatment.map(c => `<li>${c}</li>`).join('');
}

document.querySelectorAll('.state-btn').forEach(btn => {
  btn.addEventListener('click', () => setState(btn.dataset.state));
});

// ============================================================
//  ANIMATION LOOP
// ============================================================
function animate(ts) {
  if (!lastTimestamp) lastTimestamp = ts;
  const dt = Math.min(50, ts - lastTimestamp);  // cap dt for stability
  lastTimestamp = ts;

  updateParticles(dt);
  updateFiring(dt);
  updateEEG();

  renderParticles();
  renderFiring();
  renderEEG();

  requestAnimationFrame(animate);
}

// Init
setState('normal');
requestAnimationFrame(animate);
</script>

</body>
</html>
